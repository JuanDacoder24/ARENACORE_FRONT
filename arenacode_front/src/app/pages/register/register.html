<div class="auth-wrapper">
  <div class="background-decor">
    <div class="sphere sphere-1"></div>
    <div class="sphere sphere-2"></div>
  </div>

  <div class="auth-card">
    <div class="text-center mb-4">
      <div class="auth-icon-container">
        <svg width="28" height="28" fill="none" stroke="white" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
      </div>
      <h2 class="auth-title">Crear cuenta</h2>
      <p class="auth-subtitle">Únete a la arena de torneos</p>
    </div>

    <form #registerForm="ngForm" (ngSubmit)="registerUser(registerForm)" autocomplete="off">
      <!-- Nombre y Apellido -->
      <div class="row g-3 mb-3">
        <div class="col-6">
          <label class="form-label-custom">Nombre <span>*</span></label>
          <input type="text" name="nombre" placeholder="Juan" class="form-input-custom" ngModel required />
        </div>
        <div class="col-6">
          <label class="form-label-custom">Apellido <span>*</span></label>
          <input type="text" name="apellido" placeholder="García" class="form-input-custom" ngModel required />
        </div>
      </div>

      <!-- Username con espaciado extra -->
      <div class="mb-3">
        <label class="form-label-custom">Nombre de usuario <span>*</span></label>
        <div class="input-group-custom">
          <span class="input-icon">@</span>
          <input type="text" name="username" placeholder="jugador123" class="form-input-custom ps-5-custom" ngModel required minlength="3" />
        </div>
      </div>

      <!-- Email con espaciado extra -->
      <div class="mb-3">
        <label class="form-label-custom">Email <span>*</span></label>
        <div class="input-group-custom">
          <span class="input-icon">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
          </span>
          <input type="email" name="email" placeholder="tu@email.com" class="form-input-custom ps-5-custom" ngModel required email />
        </div>
      </div>

      <!-- Password con espaciado extra -->
      <div class="mb-3">
        <label class="form-label-custom">Contraseña <span>*</span></label>
        <div class="input-group-custom">
          <span class="input-icon">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </span>
          <input type="password" name="password" placeholder="••••••••" class="form-input-custom ps-5-custom" ngModel required minlength="8" />
        </div>
      </div>

      <!-- País (Recuperados) y Avatar -->
      <div class="row g-3 mb-4">
        <div class="col-5">
          <label class="form-label-custom">País</label>
          <select name="pais" class="form-input-custom" ngModel>
            <option value="">Selecciona...</option>
            <option value="Argentina">Argentina</option>
            <option value="Bolivia">Bolivia</option>
            <option value="Chile">Chile</option>
            <option value="Colombia">Colombia</option>
            <option value="Costa Rica">Costa Rica</option>
            <option value="Cuba">Cuba</option>
            <option value="Ecuador">Ecuador</option>
            <option value="El Salvador">El Salvador</option>
            <option value="España">España</option>
            <option value="Guatemala">Guatemala</option>
            <option value="Honduras">Honduras</option>
            <option value="México">México</option>
            <option value="Nicaragua">Nicaragua</option>
            <option value="Panamá">Panamá</option>
            <option value="Paraguay">Paraguay</option>
            <option value="Perú">Perú</option>
            <option value="Puerto Rico">Puerto Rico</option>
            <option value="República Dominicana">Rep. Dominicana</option>
            <option value="Uruguay">Uruguay</option>
            <option value="Venezuela">Venezuela</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div class="col-7">
          <label class="form-label-custom">URL de avatar</label>
          <input type="url" name="avatar_url" placeholder="https://..." class="form-input-custom" ngModel />
        </div>
      </div>

      <button type="submit" [disabled]="registerForm.invalid" class="btn-auth-submit">
        Crear cuenta
      </button>

      <p class="auth-footer">
        ¿Ya tienes cuenta? <a [routerLink]="['/login']">Inicia sesión</a>
      </p>
    </form>
  </div>
</div>
