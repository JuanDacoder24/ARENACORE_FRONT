<div class="auth-wrapper">
  <!-- Fondo decorativo -->
  <div class="background-decor">
    <div class="sphere sphere-1"></div>
    <div class="sphere sphere-2"></div>
  </div>

  <div class="auth-card">
    <!-- Header -->
    <div class="text-center mb-4">
      <h2 class="auth-title">Iniciar Sesión</h2>
      <p class="auth-subtitle">Accede a tu cuenta de torneos</p>
    </div>

    <!-- Formulario -->
    <form #loginForm="ngForm" (ngSubmit)="getUser(loginForm)" autocomplete="off">
      
      <!-- Campo Email -->
      <div class="mb-4">
        <label for="email" class="form-label-custom">Email</label>
        <div class="input-group-custom">
          <span class="input-icon">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </span>
          <input 
            type="text" 
            id="email" 
            name="email" 
            placeholder="Ingresa tu email"
            class="form-input-custom ps-5-custom"
            ngModel 
            required
          />
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="mb-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <label for="password" class="form-label-custom mb-0">Contraseña</label>
          <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
        </div>
        <div class="input-group-custom">
          <span class="input-icon">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
            </svg>
          </span>
          <input 
            type="password" 
            id="password" 
            name="password" 
            placeholder="••••••••"
            class="form-input-custom ps-5-custom"
            ngModel 
            required
          />
        </div>
      </div>

      <!-- Recordarme -->
      <div class="form-check mb-4">
        <input class="form-check-input custom-check" type="checkbox" id="rememberMe" name="rememberMe">
        <label class="form-check-label check-label" for="rememberMe">
          Mantener sesión iniciada
        </label>
      </div>

      <!-- Botones -->
      <button type="submit" [disabled]="loginForm.invalid" class="btn-auth-submit mb-3">
        <span class="d-flex align-items-center justify-content-center gap-2">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
          </svg>
          INICIAR SESIÓN
        </span>
      </button>

      <button type="button" class="btn-auth-secondary" [routerLink]="['/landingPage']">
        Volver al inicio
      </button>

    </form>
  </div>
</div>
