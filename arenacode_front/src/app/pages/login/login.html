<div
  class="min-vh-100 d-flex align-items-center justify-content-center position-relative overflow-hidden px-3"
  style="background: linear-gradient(135deg, #ffffff 0%)"
>
  <div class="w-100 position-relative" style="max-width: 480px">
    <!-- Header con logo -->
    <div class="text-center mb-4">
      <h2 class="fw-bold mb-2" style="color: #2a475e; font-size: 1.75rem; letter-spacing: -0.5px">
        Iniciar Sesión
      </h2>
      <p class="mb-0" style="color: #8f98a0; font-size: 0.95rem">Accede a tu cuenta de torneos</p>
    </div>

    <!-- Formulario principal -->
    <div
      class="rounded-3 shadow-lg p-4 p-md-5 border"
      style="
        background: linear-gradient(135deg, #1b2838 0%, #2a475e 100%);
        border-color: #2a475e !important;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4) !important;
      "
    >
      <form #loginForm="ngForm" (ngSubmit)="getUser()">
        <!-- Campo Email -->
        <div class="mb-4">
          <label
            for="email"
            class="form-label fw-semibold mb-2"
            style="
              color: #c7d5e0;
              font-size: 0.9rem;
              text-transform: uppercase;
              letter-spacing: 0.5px;
            "
          >
            Email
          </label>
          <div class="position-relative">
            <span
              class="position-absolute top-50 start-0 translate-middle-y ms-3"
              style="color: #66c0f4"
            >
              <svg
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
                />
              </svg>
            </span>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Ingresa tu email"
              class="form-control form-control-lg ps-5"
              style="
                background-color: #ffffff;
                border: 2px solid #2a475e;
                color: #1b2838;
                padding: 0.875rem 1rem 0.875rem 3rem;
                transition: all 0.3s ease;
              "
              [(ngModel)]="email"
              required
              onfocus="
                this.style.borderColor = '#66c0f4';
                this.style.boxShadow = '0 0 0 0.2rem rgba(102, 192, 244, 0.25)';
              "
              onblur="
                this.style.borderColor = '#2a475e';
                this.style.boxShadow = 'none';
              "
            />
          </div>
        </div>

        <!-- Campo Contraseña -->
        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <label
              for="password"
              class="form-label fw-semibold mb-0"
              style="
                color: #c7d5e0;
                font-size: 0.9rem;
                text-transform: uppercase;
                letter-spacing: 0.5px;
              "
            >
              Contraseña
            </label>
            <a href="#" class="text-decoration-none" style="color: #66c0f4; font-size: 0.85rem">
              ¿Olvidaste tu contraseña?
            </a>
          </div>
          <div class="position-relative">
            <span
              class="position-absolute top-50 start-0 translate-middle-y ms-3"
              style="color: #66c0f4"
            >
              <svg
                width="20"
                height="20"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                viewBox="0 0 24 24"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
                />
              </svg>
            </span>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Ingresa tu contraseña"
              class="form-control form-control-lg ps-5"
              style="
                background-color: #ffffff;
                border: 2px solid #2a475e;
                color: #1b2838;
                padding: 0.875rem 1rem 0.875rem 3rem;
                transition: all 0.3s ease;
              "
              [(ngModel)]="password"
              required
              onfocus="
                this.style.borderColor = '#66c0f4';
                this.style.boxShadow = '0 0 0 0.2rem rgba(102, 192, 244, 0.25)';
              "
              onblur="
                this.style.borderColor = '#2a475e';
                this.style.boxShadow = 'none';
              "
            />
          </div>
        </div>

        <!-- Recordarme -->
        <div class="form-check mb-4">
          <input
            class="form-check-input"
            type="checkbox"
            id="rememberMe"
            name="rememberMe"
            style="background-color: #0e1419; border-color: #2a475e"
          />
          <label
            class="form-check-label"
            for="rememberMe"
            style="color: #8f98a0; font-size: 0.9rem"
          >
            Mantener sesión iniciada
          </label>
        </div>

        <!-- Mensaje de Error -->
        <div
          *ngIf="errorMessage"
          class="alert alert-danger mb-4"
          role="alert"
          style="
            background-color: rgba(220, 53, 69, 0.1);
            border-left: 4px solid #dc3545;
            color: #ff6b6b;
            padding: 0.8rem;
            font-size: 0.9rem;
          "
        >
          {{ errorMessage }}
        </div>

        <!-- Botón de inicio de sesión -->
        <button
          type="submit"
          class="btn btn-lg w-100 mb-3 fw-semibold position-relative overflow-hidden"
          style="
            background: linear-gradient(90deg, #06bfff 0%, #2671be 100%);
            border: none;
            color: white;
            padding: 0.875rem;
            box-shadow: 0 4px 16px rgba(102, 192, 244, 0.4);
            transition: all 0.3s ease;
          "
          onmouseover="
            this.style.transform = 'translateY(-2px)';
            this.style.boxShadow = '0 6px 24px rgba(102, 192, 244, 0.6)';
          "
          onmouseout="
            this.style.transform = 'translateY(0)';
            this.style.boxShadow = '0 4px 16px rgba(102, 192, 244, 0.4)';
          "
        >
          <span class="d-flex align-items-center justify-content-center gap-2">
            <svg
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"
              />
            </svg>
            INICIAR SESIÓN
          </span>
        </button>

        <!-- Botón volver -->
        <button
          type="button"
          class="btn btn-lg w-100 fw-semibold"
          style="
            background-color: transparent;
            border: 2px solid #2a475e;
            color: #c7d5e0;
            padding: 0.875rem;
            transition: all 0.3s ease;
          "
          [routerLink]="['/landingPage']"
          onmouseover="
            this.style.backgroundColor = '#2a475e';
            this.style.borderColor = '#66c0f4';
          "
          onmouseout="
            this.style.backgroundColor = 'transparent';
            this.style.borderColor = '#2a475e';
          "
        >
          Volver al inicio
        </button>
      </form>

      <!-- Separador -->
      <div class="position-relative my-4">
        <hr style="border-color: #2a475e; opacity: 0.5" />
        <span
          class="position-absolute top-50 start-50 translate-middle px-3"
          style="
            background: linear-gradient(135deg, #1b2838 0%, #2a475e 100%);
            color: #8f98a0;
            font-size: 0.85rem;
          "
        >
          O ÚNETE CON
        </span>
      </div>

      <!-- Botones sociales -->
      <div class="row g-2">
        <div class="col-4">
          <button
            type="button"
            class="btn w-100 p-2"
            style="
              background-color: #0e1419;
              border: 2px solid #2a475e;
              color: #c7d5e0;
              transition: all 0.3s ease;
            "
            onmouseover="
              this.style.backgroundColor = '#2a475e';
              this.style.borderColor = '#66c0f4';
            "
            onmouseout="
              this.style.backgroundColor = '#0e1419';
              this.style.borderColor = '#2a475e';
            "
          >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"
              />
            </svg>
          </button>
        </div>
        <div class="col-4">
          <button
            type="button"
            class="btn w-100 p-2"
            style="
              background-color: #0e1419;
              border: 2px solid #2a475e;
              color: #c7d5e0;
              transition: all 0.3s ease;
            "
            onmouseover="
              this.style.backgroundColor = '#2a475e';
              this.style.borderColor = '#66c0f4';
            "
            onmouseout="
              this.style.backgroundColor = '#0e1419';
              this.style.borderColor = '#2a475e';
            "
          >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M9 8h-3v4h3v12h5v-12h3.642l.358-4h-4v-1.667c0-.955.192-1.333 1.115-1.333h2.885v-5h-3.808c-3.596 0-5.192 1.583-5.192 4.615v3.385z"
              />
            </svg>
          </button>
        </div>
        <div class="col-4">
          <button
            type="button"
            class="btn w-100 p-2"
            style="
              background-color: #0e1419;
              border: 2px solid #2a475e;
              color: #c7d5e0;
              transition: all 0.3s ease;
            "
            onmouseover="
              this.style.backgroundColor = '#2a475e';
              this.style.borderColor = '#66c0f4';
            "
            onmouseout="
              this.style.backgroundColor = '#0e1419';
              this.style.borderColor = '#2a475e';
            "
          >
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
              <path
                d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"
              />
            </svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
