<section class="container my-5">
    <div class="row g-4">
        <div class="col-12">
            <div class="card h-100 shadow-sm hover-card">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{torneo.nombre}}</h5>
                    <p class="card-text text-muted grow">{{torneo.descripcion}}</p>
                    <h5 class="card-text">Juego ID: {{torneo.juego_id}}</h5>
                    <h5 class="card-text">Organizador ID: {{torneo.organizador_id}}</h5>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary mt-auto" (click)="router.navigate(['/torneo', torneo.id])">
                            Ver Detalles
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
