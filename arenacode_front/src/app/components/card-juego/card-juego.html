<div style="
  background: #fff;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  border: 1px solid #e5e7eb;
  display: flex;
  flex-direction: column;
">

  <!-- Imagen -->
  <img 
    [src]="juego.imagen_url" 
    [alt]="juego.nombre"
    style="width: 100%; height: 220px; object-fit: cover;"
  />

  <!-- Contenido -->
  <div style="padding: 16px; display: flex; flex-direction: column; gap: 6px;">
    
    <h5 style="font-size: 1.1rem; font-weight: 700; margin: 0; color: #111;">{{ juego.nombre }}</h5>
    <p style="font-size: 0.85rem; color: #6b7280; margin: 0;">{{ juego.descripcion }}</p>
    <p style="font-size: 0.9rem; font-weight: 700; color: #111; margin: 4px 0;">Categoria: {{ juego.categoria_id }}</p>

    <button
      (click)="router.navigate(['/juego', juego.id])"
      style="
        background: #111;
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
        width: fit-content;
        margin-top: 4px;
      "
      onmouseover="this.style.background='#333'"
      onmouseout="this.style.background='#111'"
    >
      Ver Detalles
    </button>

  </div>
</div>
