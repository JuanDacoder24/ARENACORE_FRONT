<div class="game-card-v2">
  <div class="game-image-container">
    <img [src]="juego.imagen_url" [alt]="juego.nombre" class="game-img" />
    <div class="game-overlay"></div>
    <span class="game-category-tag">Cat: {{ nombreCategoria}}</span>
  </div>

  <div class="game-content-v2">
    <h5 class="game-title-v2">{{ juego.nombre }}</h5>
    <p class="game-desc-v2">{{ juego.descripcion }}</p>
    
    
  </div>
</div>
